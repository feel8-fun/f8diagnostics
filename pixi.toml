[workspace]
name = "f8diagnostics"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.14.3,<3.15"
pip = ">=26,<27"
pytest = ">=8.4.2,<9"

[pypi-dependencies]
f8pysdk = { path = ".sdk/python", editable = true }
f8diagnostics = { path = ".", editable = true }
hatchling = ">=1.28,<2"
basedpyright = ">=1.31,<2"
ruff = ">=0.12,<0.13"

[tasks]
test = "python -m pytest tests -q"
check = "python -m f8pysdk.extension_packaging --check"
wheel = "python -m pip wheel --no-deps --no-build-isolation -w build/wheels ."
bundle = { cmd = "python -m f8pysdk.extension_packaging --wheel-dir build/wheels --output build/extension.zip", depends-on = ["wheel", "check"] }
