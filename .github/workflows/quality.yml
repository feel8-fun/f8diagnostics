name: diagnostics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: feel8-fun/f8sdk
          ref: a977f137b8280db8566bd52a62a1805092725fb9
          path: .sdk
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          cache: true
      - run: pixi run check
      - run: pixi run test
      - run: pixi run basedpyright -p pyrightconfig.json
      - run: pixi run ruff check f8diagnostics
      - run: pixi run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            build/extension.zip
            build/extension.zip.sha256
          if-no-files-found: error
