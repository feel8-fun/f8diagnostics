[project]
name = "f8diagnostics"
version = "0.2.0"
description = "Optional diagnostics and debugging tools for Feel8 extensions."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["f8pysdk>=0.1.0,<0.2", "msgspec>=0.18.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8diagnostics"]
